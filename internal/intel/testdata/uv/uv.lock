version = 1
requires-python = ">=3.11"

[[package]]
name = "fastapi"
version = "0.110.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "pydantic" },
    { name = "starlette" },
]
sdist = { url = "https://files.pythonhosted.org/fastapi-0.110.0.tar.gz", hash = "sha256:a", size = 1 }
wheels = [
    { url = "https://files.pythonhosted.org/fastapi-0.110.0-py3-none-any.whl", hash = "sha256:b", size = 2 },
]

[[package]]
name = "jinja2"
version = "3.1.2"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "starlette"
version = "0.36.3"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pydantic"
version = "2.6.0b1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "ruff"
version = "0.4.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "uvapp"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "fastapi" },
    { name = "jinja2" },
]

[package.dev-dependencies]
dev = [
    { name = "ruff" },
]
