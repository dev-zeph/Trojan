rules:
  - id: trojan-js-weak-password-hash
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      This code protects passwords with a method that is far too easy to crack.
      Either a fast general-purpose hash (MD5 or SHA) is used on a password, or
      PBKDF2 is called with far too few iterations (OWASP recommends about
      600,000 for PBKDF2-HMAC-SHA256; anything under 100,000 is weak). If the
      user table ever leaks (a backup, an injection bug, a stolen laptop), an
      attacker can crack most of these passwords quickly on a gaming GPU, then
      reuse them on your users' other accounts. Use a password hashing function
      with a strong work factor: bcrypt, argon2, scrypt, or PBKDF2 with at
      least 600,000 iterations.
    metadata:
      trojan-title: Passwords protected with a weak, crackable hash
      trojan-severity: high
      cwe:
        - "CWE-916: Use of Password Hash With Insufficient Computational Effort"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          # A fast general-purpose hash (MD5/SHA) used on a password.
          - patterns:
              - pattern-either:
                  # The hashed value is named like a password...
                  - patterns:
                      - pattern: $C.createHash($ALG).update($PW, ...)
                      - metavariable-regex:
                          metavariable: $PW
                          regex: (?i)^[\w.\[\]"']*(passw|pwd|passphrase)[\w\]"']*$
                  # ...or the hashing happens inside a password helper.
                  - patterns:
                      - pattern-either:
                          - pattern-inside: |
                              function $FN(...) { ... }
                          - pattern-inside: |
                              $FN = (...) => { ... }
                          - pattern-inside: |
                              $FN = (...) => $BODY
                          - pattern-inside: |
                              $FN(...) { ... }
                      - metavariable-regex:
                          metavariable: $FN
                          regex: (?i).*(hash|verify|check|compare|encrypt|store)_?(user)?_?(passw|pwd).*
                      - pattern: $C.createHash($ALG).update(...)
              - metavariable-regex:
                  metavariable: $ALG
                  regex: (?i)^["'`](md4|md5|sha-?1|sha-?224|sha-?256|sha-?384|sha-?512|sha3-\d+|ripemd160)["'`]$
          # PBKDF2 called with too few iterations to slow an attacker down.
          - patterns:
              - pattern-either:
                  - pattern: $C.pbkdf2Sync($PW, $SALT, $ITER, ...)
                  - pattern: $C.pbkdf2($PW, $SALT, $ITER, ...)
              - metavariable-comparison:
                  metavariable: $ITER
                  comparison: $ITER < 100000
          # A PBKDF2 iteration count set far too low in a config object, where
          # the call site reads it by name (so constant propagation can't see
          # it). A value of 32..99999 cannot be a bcrypt cost (max 31), so this
          # is unambiguously a weak key-derivation work factor.
          - patterns:
              - pattern: "$K: $N"
              - metavariable-regex:
                  metavariable: $K
                  regex: (?i)^(password_?rounds|password_?iterations|pbkdf2?_?(iterations|rounds)|hash_?iterations|kdf_?iterations)$
              - metavariable-comparison:
                  metavariable: $N
                  comparison: $N >= 32 and $N < 100000

  - id: trojan-js-predictable-token
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A security token (password reset, invite, verification, session) is
      built from values an attacker can know or guess: the time, an email
      address, a user ID, or Math.random(). Hashing them does not help,
      because the attacker can run the same hash. Someone who knows a user's
      email can work out their reset link and take over the account. Generate
      tokens with crypto.randomBytes(32) or crypto.randomUUID() and store them.
    metadata:
      trojan-title: Security token can be guessed (built from time or email)
      trojan-severity: critical
      cwe:
        - "CWE-330: Use of Insufficiently Random Values"
        - "CWE-640: Weak Password Recovery Mechanism for Forgotten Password"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: MEDIUM
    mode: taint
    options:
      taint_assume_safe_functions: false
    pattern-sources:
      - pattern: Date.now()
      - pattern: new Date()
      - pattern: Math.random()
      - pattern: process.hrtime(...)
      - pattern: performance.now()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  function $FN(...) { ... }
              - pattern-inside: |
                  $FN = (...) => { ... }
              - pattern-inside: |
                  $FN(...) { ... }
          - metavariable-regex:
              metavariable: $FN
              regex: (?i).*(token|reset|nonce|otp|invite|verif|magic|confirm|activation|csrf|apikey|api_key).*
          - pattern: $C.createHash(...).update($X, ...)
          - focus-metavariable: $X

  - id: trojan-js-math-random-token
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A security token (reset link, invite, verification code, session ID) is
      made with Math.random(). Math.random() is not secure randomness: its
      output can be predicted after seeing a few values, so an attacker can
      guess other users' tokens. Use crypto.randomBytes(32) or
      crypto.randomUUID() instead.
    metadata:
      trojan-title: Security token made with Math.random()
      cwe:
        - "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern-inside: |
              function $FN(...) { ... }
          - pattern-inside: |
              $FN = (...) => { ... }
          - pattern-inside: |
              $FN = (...) => $BODY
          - pattern-inside: |
              $FN(...) { ... }
      - metavariable-regex:
          metavariable: $FN
          regex: (?i).*(token|reset|nonce|otp|invite|verif|magic|confirm|activation|csrf|apikey|api_key|session_?id|secret).*
      - pattern: Math.random()
