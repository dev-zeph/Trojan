rules:
  - id: trojan-js-weak-password-hash
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Passwords are stored with a fast general-purpose hash (MD5 or SHA). If
      the user table ever leaks (a backup, an injection bug, a stolen laptop),
      an attacker can crack most of these hashes in minutes on a gaming GPU,
      then reuse those passwords on your users' other accounts. Use a password
      hashing function built for this: bcrypt, argon2, or scrypt.
    metadata:
      trojan-title: Passwords stored with a fast, crackable hash
      cwe:
        - "CWE-916: Use of Password Hash With Insufficient Computational Effort"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          # The hashed value is named like a password...
          - patterns:
              - pattern: $C.createHash($ALG).update($PW, ...)
              - metavariable-regex:
                  metavariable: $PW
                  regex: (?i)^[\w.\[\]"']*(passw|pwd|passphrase)[\w\]"']*$
          # ...or the hashing happens inside a password helper.
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      function $FN(...) { ... }
                  - pattern-inside: |
                      $FN = (...) => { ... }
                  - pattern-inside: |
                      $FN = (...) => $BODY
                  - pattern-inside: |
                      $FN(...) { ... }
              - metavariable-regex:
                  metavariable: $FN
                  regex: (?i).*(hash|verify|check|compare|encrypt|store)_?(user)?_?(passw|pwd).*
              - pattern: $C.createHash($ALG).update(...)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^["'`](md4|md5|sha-?1|sha-?224|sha-?256|sha-?384|sha-?512|sha3-\d+|ripemd160)["'`]$

  - id: trojan-js-predictable-token
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A security token (password reset, invite, verification, session) is
      built from values an attacker can know or guess: the time, an email
      address, a user ID, or Math.random(). Hashing them does not help,
      because the attacker can run the same hash. Someone who knows a user's
      email can work out their reset link and take over the account. Generate
      tokens with crypto.randomBytes(32) or crypto.randomUUID() and store them.
    metadata:
      trojan-title: Security token can be guessed (built from time or email)
      cwe:
        - "CWE-330: Use of Insufficiently Random Values"
        - "CWE-640: Weak Password Recovery Mechanism for Forgotten Password"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: MEDIUM
    mode: taint
    options:
      taint_assume_safe_functions: false
    pattern-sources:
      - pattern: Date.now()
      - pattern: new Date()
      - pattern: Math.random()
      - pattern: process.hrtime(...)
      - pattern: performance.now()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  function $FN(...) { ... }
              - pattern-inside: |
                  $FN = (...) => { ... }
              - pattern-inside: |
                  $FN(...) { ... }
          - metavariable-regex:
              metavariable: $FN
              regex: (?i).*(token|reset|nonce|otp|invite|verif|magic|confirm|activation|csrf|apikey|api_key).*
          - pattern: $C.createHash(...).update($X, ...)
          - focus-metavariable: $X

  - id: trojan-js-math-random-token
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A security token (reset link, invite, verification code, session ID) is
      made with Math.random(). Math.random() is not secure randomness: its
      output can be predicted after seeing a few values, so an attacker can
      guess other users' tokens. Use crypto.randomBytes(32) or
      crypto.randomUUID() instead.
    metadata:
      trojan-title: Security token made with Math.random()
      cwe:
        - "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern-inside: |
              function $FN(...) { ... }
          - pattern-inside: |
              $FN = (...) => { ... }
          - pattern-inside: |
              $FN = (...) => $BODY
          - pattern-inside: |
              $FN(...) { ... }
      - metavariable-regex:
          metavariable: $FN
          regex: (?i).*(token|reset|nonce|otp|invite|verif|magic|confirm|activation|csrf|apikey|api_key|session_?id|secret).*
      - pattern: Math.random()
