rules:
  # define('DB_PASSWORD', 'hunter2') and define('JWT_SECRET_KEY',
  # getenv('JWT_SECRET_KEY') ?: 'snowman'). A regex rule so it also covers
  # .inc and .php.dist config files, which Semgrep does not parse as PHP.
  - id: trojan-php-hardcoded-secret-constant
    languages: [regex]
    severity: ERROR
    message: >-
      A password or secret key is written directly in the code. Anyone who can
      see the code (a teammate, a leaked backup, a public repo) can use it to
      get into your database or forge logins. Read it from an environment
      variable or a config file that is not committed, and change the old
      value.
    metadata:
      trojan-title: Password or secret key written in the code
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: MEDIUM
    paths:
      include:
        - "*.php"
        - "*.inc"
        - "*.php.dist"
        - "*.php.example"
        - "*.php.sample"
    patterns:
      - pattern-regex: (?i)\bdefine\s*\(\s*['"](?P<NAME>[A-Z0-9_]*(PASS|PASSWD|PASSWORD|PWD|SECRET|PRIVATE_KEY|API_KEY|APIKEY|AUTH_KEY|TOKEN|SALT)[A-Z0-9_]*)['"]\s*,\s*(getenv\s*\([^)]*\)\s*\?:\s*)?['"](?P<VALUE>[^'"\r\n]*)['"]
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.{3,}$
      - metavariable-regex:
          metavariable: $VALUE
          # Skip obvious placeholders, not real secrets.
          regex: (?i)^(?!(x+|\*+|\.+|changeme|change[_ -]?me|change[_ -]?this.*|your[_ -].*|<.*>|\{.*\}|\$\{.*\}|%.*%|placeholder|example|dummy|todo|none|null|secret|password|put[_ -].*|enter[_ -].*|replace[_ -].*)$)

  # $db_password = 'hunter2'; $_DVWA['db_password'] = getenv(..) ?: 'p@ssw0rd';
  # Only in config-like files, so test fixtures and login checks don't count.
  - id: trojan-php-hardcoded-db-password
    languages: [regex]
    severity: ERROR
    message: >-
      A password, API key, or secret token is written directly in a config
      file that lives with your code. Anyone who can see the code (a teammate,
      a leaked backup, a public repo) can use it to get into your database or
      a paid service account. Read it from an environment variable or a config
      file that is not committed, and rotate the old value.
    metadata:
      trojan-title: Password or key written in a config file
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: MEDIUM
    paths:
      include:
        - "*config*.php"
        - "*config*.inc"
        - "*config*.dist"
        - "*settings*.php"
        - "*settings*.inc"
        - "*database*.php"
        - "*database*.inc"
        - "*db*.php"
        - "*db*.inc"
        - "*connect*.php"
        - "*connect*.inc"
        - "*.php.dist"
        - "*.php.example"
        - "*.php.sample"
        - "wp-config*.php"
    patterns:
      - pattern-regex: (?i)(\$[a-z0-9_]*(pass|passwd|password|pwd|secret|token|salt|key)[a-z0-9_]*|\[\s*['"][a-z0-9_]*(pass|passwd|password|pwd|secret|token|salt|key)[a-z0-9_]*['"]\s*\])\s*=\s*(getenv\s*\([^)]*\)\s*\?:\s*)?['"](?P<VALUE>[^'"\r\n]*)['"]\s*;
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.{3,}$
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?i)^(?!(x+|\*+|\.+|changeme|change[_ -]?me|change[_ -]?this.*|your[_ -].*|<.*>|\{.*\}|\$\{.*\}|%.*%|placeholder|example|dummy|todo|none|null|secret|password|put[_ -].*|enter[_ -].*|replace[_ -].*)$)
