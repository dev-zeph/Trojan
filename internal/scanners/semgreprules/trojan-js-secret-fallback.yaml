rules:
  - id: trojan-js-secret-fallback
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A secret is read from an environment variable, but the code falls back
      to a value written in the source when the variable is missing. If the
      variable is ever unset (a new server, a preview deploy, a typo), the app
      quietly uses the fallback, and anyone who has seen the code can use it
      to forge logins or sign tokens. Remove the fallback and refuse to start
      when the secret is missing.
    metadata:
      trojan-title: Secret falls back to a value written in the code
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: process.env.$K || $FALLBACK
          - pattern: process.env.$K ?? $FALLBACK
          - pattern: process.env[$K] || $FALLBACK
          - pattern: process.env[$K] ?? $FALLBACK
      - metavariable-regex:
          metavariable: $K
          regex: (?i).*(secret|token|private|signing|salt|passw|api_?key|jwt|hmac|cookie_?key|session_?key).*
      # The fallback must carry a value fixed in the code (a string literal,
      # possibly joined or concatenated), not another env var, an empty
      # default that fails closed, or a freshly generated random value.
      - metavariable-pattern:
          metavariable: $FALLBACK
          patterns:
            - pattern-either:
                - pattern: |
                    "..."
                - pattern: <... "..." ...>
            - pattern-not: |
                ""
            - pattern-not-inside: <... process.env.$J ...>
            - pattern-not-inside: <... process.env[$J] ...>
            - pattern-not-inside: <... $C.randomBytes(...) ...>
            - pattern-not-inside: <... randomBytes(...) ...>
            - pattern-not-inside: <... $C.randomUUID(...) ...>
            - pattern-not-inside: <... randomUUID(...) ...>
            - pattern-not-inside: <... $C.getRandomValues(...) ...>

  # Same mistake without the env var: the signing key is a string literal.
  - id: trojan-js-hardcoded-signing-key
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Logins or tokens are signed with a key written in the source code.
      Anyone who has seen the code (a leaked repo, an ex-contractor, a public
      GitHub) can create valid sessions or tokens for any account, including
      admins. Load the key from an environment variable or a secrets manager.
    metadata:
      trojan-title: Login or token signing key written in the code
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: HIGH
    paths:
      exclude:
        - "*.test.*"
        - "*.spec.*"
        - "**/test/**"
        - "**/tests/**"
        - "**/__tests__/**"
        - "**/fixtures/**"
        - "**/mocks/**"
    pattern-either:
      - pattern: $C.createHmac($ALG, "...")
      - pattern: $JWT.sign($P, "...", ...)
      - pattern: $JWT.verify($T, "...", ...)
      - pattern: |
          $S({..., secret: "...", ...})
