rules:
  - id: trojan-js-hardcoded-password
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A password or secret is written directly in the source code. Anyone who
      can see the code (teammates, contractors, a leaked or public repo, a
      server-side bug that reads files) gets the credential and can log in to
      that service as your app. Move it to an environment variable or a
      secrets manager, and change the password, since it has already been
      exposed in your code history.
    metadata:
      trojan-title: Password written in the code
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: MEDIUM
    paths:
      exclude:
        - "*.test.*"
        - "*.spec.*"
        - "**/test/**"
        - "**/tests/**"
        - "**/__tests__/**"
        - "**/fixtures/**"
        - "**/mocks/**"
        - "**/seed*"
    patterns:
      - pattern-either:
          - pattern: |
              {..., $KEY: "$VALUE", ...}
          - pattern: |
              const $KEY = "$VALUE";
          - pattern: |
              let $KEY = "$VALUE";
          - pattern: |
              $OBJ.$KEY = "$VALUE";
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^["']?(pass|passwd|password|pwd|db_?pass(word)?|smtp_?pass(word)?|client_?secret|secret_?key|api_?secret|auth_?token|access_?token|private_?key)["']?$
      # A real credential: 8+ characters mixing letters with digits or
      # symbols. This skips UI labels ("Password"), placeholders and empties.
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?=.*[A-Za-z])(?=.*[0-9!@#$%^&*_+=?~-])[^\s<>{}]{8,}$
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?i)^(?!.*(change.?me|your[_-]|example|placeholder|xxxx|\*\*\*|password123|dummy|redacted|todo)).*$
