# Full list of options at https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:7879/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.external.github]
enabled = true
client_id = "env(GITHUB_CLIENT_ID)"
secret = "env(GITHUB_CLIENT_SECRET)"

# Stripe signs its webhooks with STRIPE_WEBHOOK_SECRET and sends NO Supabase
# Authorization header, so the platform's JWT gate must be off for this one
# function -- the signature check inside index.ts is the real authentication.
#
# This block exists because `supabase functions deploy` defaults verify_jwt to
# true and silently re-armed the gate on 2026-09-16, which would have made every
# Stripe event 401 and every paid purchase grant zero tokens.
[functions.stripe-webhook]
verify_jwt = false
