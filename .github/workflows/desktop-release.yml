name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon (M1/M2/M3)
            target: aarch64-apple-darwin
            goos: darwin
            go-arch: arm64
            ext: ""
          - os: windows-latest    # Windows x64 (unsigned for now — SmartScreen warning expected)
            target: x86_64-pc-windows-msvc
            goos: windows
            go-arch: amd64
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Node must come before Go — embed.go embeds ui/dist and dast-ui/dist
      # at compile time, so both must exist before `go build` runs.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            dast-ui/package-lock.json
            desktop/package-lock.json

      - name: Build embedded UI
        shell: bash
        run: cd ui && npm ci && npm run build

      - name: Build embedded DAST UI
        shell: bash
        run: cd dast-ui && npm ci && npm run build && touch dist/.gitkeep

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Go sidecar
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#desktop-}"   # strip "desktop-" prefix → v0.2.0
          mkdir -p desktop/src-tauri/binaries
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.go-arch }} go build \
            -ldflags="-X main.version=${VERSION}" \
            -o "desktop/src-tauri/binaries/trojan-${{ matrix.target }}${{ matrix.ext }}" \
            ./cmd/trojan
          chmod +x "desktop/src-tauri/binaries/trojan-${{ matrix.target }}${{ matrix.ext }}" || true

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # Entitlements are parsed by AMFI, which is much stricter than plutil --
      # plutil -lint happily accepts XML comments that AMFI rejects, and the
      # failure only surfaces at the codesign step AFTER a four-minute Rust
      # build. desktop-v0.3.0 was lost to exactly that.
      #
      # Ad-hoc signing a throwaway binary runs the same parser in about a
      # second. Note codesign EXITS 0 here even when the parse fails, so the
      # stderr message is the only reliable signal -- do not "simplify" this
      # into a bare codesign call and trust its exit code.
      - name: Check entitlements parse
        if: matrix.os == 'macos-14'
        working-directory: desktop/src-tauri
        run: |
          set -euo pipefail
          probe=$(mktemp)
          cp /bin/echo "$probe"
          codesign --force --sign - --entitlements Entitlements.plist "$probe" 2>&1 | tee /tmp/ents.log
          if grep -q 'Failed to parse entitlements' /tmp/ents.log; then
            echo "::error file=desktop/src-tauri/Entitlements.plist::AMFI cannot parse Entitlements.plist. Remove XML comments -- see Entitlements.md."
            exit 1
          fi
          echo "Entitlements parse cleanly:"
          codesign -d --entitlements - "$probe"

      - name: Build Tauri app
        working-directory: desktop
        # Use "npm run tauri" (not "npm run build:tauri") to skip the
        # prebuild:tauri hook — the Go sidecar is already built above.
        run: npm run tauri build -- --target ${{ matrix.target }}
        env:
          # Signing + notarization, macOS leg only. Every value below is empty
          # on the Windows runner, and the Tauri CLI skips signing entirely when
          # APPLE_CERTIFICATE is unset — so Windows keeps building unsigned
          # exactly as before (see the matrix comment above).
          #
          # Tauri v2 does the whole dance inside `tauri build`: it imports the
          # .p12 into a temporary keychain, signs the .app AND the nested Go
          # sidecar from bundle.externalBin, then submits to notarytool and
          # staples. There is deliberately no separate codesign/notarytool step.
          #
          # APPLE_PASSWORD is an app-specific password, NOT the Apple ID
          # password. It is tied to the Apple ID, so it stops working if that
          # password is ever changed — if notarization starts failing with an
          # auth error, regenerate it at appleid.apple.com first. Moving to an
          # App Store Connect API key (APPLE_API_ISSUER / APPLE_API_KEY /
          # APPLE_API_KEY_PATH) removes that failure mode.
          APPLE_CERTIFICATE: ${{ matrix.os == 'macos-14' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.os == 'macos-14' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-14' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-14' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.os == 'macos-14' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-14' && secrets.APPLE_TEAM_ID || '' }}

      # Fail the build rather than ship another unsigned release. Seven public
      # desktop releases went out unsigned because nothing ever checked, and the
      # website picks up whatever .dmg it finds (lib/releases.ts) without
      # looking at its signature.
      - name: Verify signature and notarization
        if: matrix.os == 'macos-14'
        working-directory: desktop
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Trojan.app"
          DMG=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)

          echo "::group::codesign"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|flags'
          echo "::endgroup::"

          # The sidecar is a nested Mach-O. If it is unsigned, notarization
          # fails -- and if it were somehow missed, the app breaks on launch.
          echo "::group::sidecar"
          codesign --verify --strict --verbose=2 \
            "$APP/Contents/MacOS/trojan-${{ matrix.target }}"
          echo "::endgroup::"

          # The real test. "source=Notarized Developer ID" is the only output
          # that means a downloader will not see a Gatekeeper warning.
          echo "::group::gatekeeper"
          spctl -a -vvv -t install "$DMG"
          xcrun stapler validate "$DMG"
          echo "::endgroup::"

      # Uploads whatever this OS produced; globs that match nothing are ignored
      # (fail_on_unmatched_files defaults to false). macOS → .dmg; Windows →
      # NSIS .exe + .msi. Both matrix jobs write to the same draft release.
      - name: Upload installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
