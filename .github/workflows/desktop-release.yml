name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon (M1/M2/M3)
            target: aarch64-apple-darwin
            goos: darwin
            go-arch: arm64
            ext: ""
          - os: windows-latest    # Windows x64 (unsigned for now — SmartScreen warning expected)
            target: x86_64-pc-windows-msvc
            goos: windows
            go-arch: amd64
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Node must come before Go — embed.go embeds ui/dist and dast-ui/dist
      # at compile time, so both must exist before `go build` runs.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            dast-ui/package-lock.json
            desktop/package-lock.json

      - name: Build embedded UI
        shell: bash
        run: cd ui && npm ci && npm run build

      - name: Build embedded DAST UI
        shell: bash
        run: cd dast-ui && npm ci && npm run build && touch dist/.gitkeep

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Go sidecar
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#desktop-}"   # strip "desktop-" prefix → v0.2.0
          mkdir -p desktop/src-tauri/binaries
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.go-arch }} go build \
            -ldflags="-X main.version=${VERSION}" \
            -o "desktop/src-tauri/binaries/trojan-${{ matrix.target }}${{ matrix.ext }}" \
            ./cmd/trojan
          chmod +x "desktop/src-tauri/binaries/trojan-${{ matrix.target }}${{ matrix.ext }}" || true

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Build Tauri app
        working-directory: desktop
        # Use "npm run tauri" (not "npm run build:tauri") to skip the
        # prebuild:tauri hook — the Go sidecar is already built above.
        run: npm run tauri build -- --target ${{ matrix.target }}

      # Uploads whatever this OS produced; globs that match nothing are ignored
      # (fail_on_unmatched_files defaults to false). macOS → .dmg; Windows →
      # NSIS .exe + .msi. Both matrix jobs write to the same draft release.
      - name: Upload installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
