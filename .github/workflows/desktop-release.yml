name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon (M1/M2/M3)
            target: aarch64-apple-darwin
            go-arch: arm64
          - os: macos-13          # Intel x86_64
            target: x86_64-apple-darwin
            go-arch: amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Node must come before Go because embed.go embeds ui/dist and
      # dast-ui/dist at compile time — both must exist before `go build` runs.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            dast-ui/package-lock.json
            desktop/package-lock.json

      - name: Build embedded UI
        run: cd ui && npm ci && npm run build

      - name: Build embedded DAST UI
        run: cd dast-ui && npm ci && npm run build && touch dist/.gitkeep

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Go sidecar
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#desktop-}"   # strip "desktop-" prefix → v0.1.0
          mkdir -p desktop/src-tauri/binaries
          GOOS=darwin GOARCH=${{ matrix.go-arch }} go build \
            -ldflags="-X main.version=${VERSION}" \
            -o desktop/src-tauri/binaries/trojan-${{ matrix.target }} \
            ./cmd/trojan
          chmod +x desktop/src-tauri/binaries/trojan-${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Build Tauri app
        working-directory: desktop
        # Use "npm run tauri" (not "npm run build:tauri") to skip the
        # prebuild:tauri hook — the Go sidecar is already built above.
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
